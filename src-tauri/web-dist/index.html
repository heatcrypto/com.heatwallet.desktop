<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">

<head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="description" content="Crypto Wallet Communicator" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Updated meta tag -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Heat Wallet" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png?v=bvf9a" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png?v=bvf9a" />

    <!-- Modern Web Manifest -->
    <link rel="manifest" href="manifest.json?v=bvf9a" crossorigin="use-credentials" />

    <title>Heat Wallet</title>

    <style>
        :root {
            --background-color: #f2f5f3;
            --loader-opacity: 0.66;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background-color: #121212;
                --text-color: #e0e0e0;
                --loader-opacity: 0.8;
            }
        }

        body {
            background-color: var(--background-color);
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>

    <!-- Preload with crossorigin -->
    <link rel="preload" href="flutter_bootstrap.js?v=bvf9a" as="script"
        crossorigin="anonymous" />
    <link rel="preload" href="icons/Icon-192.png?v=bvf9a" as="image"
        crossorigin="anonymous" />
</head>

<body>
    <div id="loading" role="status" aria-label="Loading application">
        <style>
            #loading {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                pointer-events: none;
                transition: opacity 0.3s ease-out;
            }

            #loading picture img {
                animation: breathe 1s ease-in-out infinite alternate;
                opacity: var(--loader-opacity);
                max-width: 192px;
                will-change: transform, opacity;
            }

            #loading.main_done picture img {
                opacity: 1;
            }

            #loading.init_done picture img {
                animation: zooooom 0.33s ease-in-out forwards;
                opacity: 0.05;
            }

            #loading span {
                margin-top: 1.25rem;
                font-family: Verdana, Arial, 'Helvetica Neue', Helvetica, sans-serif;
                font-size: 1.125rem;
                color: var(--text-color);
                text-align: center;
                animation: fadeInOut 2.0s ease-in-out infinite;
            }


            @keyframes fadeInOut {
                0% {
                    opacity: 0;
                }

                50% {
                    opacity: 1;
                }

                100% {
                    opacity: 0;
                }
            }

            @keyframes breathe {
                from {
                    transform: scale(1);
                }

                to {
                    transform: scale(0.8);
                }
            }

            @keyframes zooooom {
                from {
                    transform: scale(1);
                }

                to {
                    transform: scale(10);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                #loading picture img {
                    animation: none;
                }
            }
        </style>
        <picture>
            <img src="icons/Icon-192.png?v=bvf9a" alt="Loading indicator" loading="eager" />
        </picture>
        <span>Loading App contents...</span>
    </div>

    <!-- Core Scripts -->
    <script type="module">
        // PWA Installation Handling
        window.__deferredInstallPrompt__ = null;
        window.addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();
            window.__deferredInstallPrompt__ = e;
        });

        window.__showDeferredInstallPrompt__ = async () => {
            if (window.__deferredInstallPrompt__) {
                await window.__deferredInstallPrompt__.prompt();
                return window.__deferredInstallPrompt__.userChoice;
            }
        };

        // Clipboard API
        window.__readClipboardData__ = async () => {
            try {
                return await navigator.clipboard.readText();
            } catch (error) {
                console.error("Clipboard read failed:", error);
                return null;
            }
        };

        // PWA Installation Status
        window.__pwaAppInstalled__ = false;
        window.addEventListener('appinstalled', () => {
            window.__pwaAppInstalled__ = true;
        });
        window.__getPwaAppInstalled__ = () => window.__pwaAppInstalled__;

        // Firebase Setup
        import * as core from "./firebasejs/firebase-app.js";
        import * as messaging from "./firebasejs/firebase-messaging.js";
        window["firebase_core"] = core;
        window["firebase_messaging"] = messaging;
        window.flutterfire_ignore_scripts = ["core", "messaging"];
    </script>
